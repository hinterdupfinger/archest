[package]
name = "archest-core-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.16.1", default-features = false, features = ["napi4", "napi5", "napi6", "napi7", "napi8", "tokio_rt"] }
napi-derive = "2.16.1"
tree-sitter = "0.22"
tree-sitter-typescript = "0.21.2"
tree-sitter-javascript = "0.21.4"
tree-sitter-html = "0.20.0"
tree-sitter-css = "0.20.0"
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
napi-build = "2.1"
