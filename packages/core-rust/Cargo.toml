[package]
name = "archest-core-rust"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "crates/archest-core",
    "crates/archest-jvm"
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.16.1", default-features = false, features = ["napi4", "napi5", "napi6", "napi7", "napi8", "tokio_rt"] }
napi-derive = "2.16.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
archest-core = { path = "crates/archest-core", default-features = false, features = ["typescript"] }

[build-dependencies]
napi-build = "2.1"


