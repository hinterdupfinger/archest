[package]
name = "archest-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
default = ["typescript"]
typescript = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript", "dep:tree-sitter-html", "dep:tree-sitter-css"]
jvm = ["dep:tree-sitter-java", "dep:tree-sitter-kotlin"]

[dependencies]
tree-sitter = "0.22"
tree-sitter-typescript = { version = "0.21.2", optional = true }
tree-sitter-javascript = { version = "0.21.4", optional = true }
tree-sitter-html = { version = "0.20.0", optional = true }
tree-sitter-css = { version = "0.20.0", optional = true }
tree-sitter-java = { version = "0.21.0", optional = true }
tree-sitter-kotlin = { version = "0.3.0", optional = true }
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
